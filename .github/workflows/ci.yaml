name: ci.yaml - medicojob-availability-service

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SERVICE_NAME: medicojob-availability-service
  RUNTIME: node
  SONAR_PROJECT_KEY: medicojob-availability-service

jobs:
  validate:
    name: Node validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout service
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests when configured
        shell: bash
        run: |
          test_script="$(node -e "const p=require('./package.json'); console.log((p.scripts && p.scripts.test) || '')")"
          if [ -z "$test_script" ] || echo "$test_script" | grep -qi 'no test specified'; then
            echo "No real npm test script configured for $SERVICE_NAME."
          else
            CI=true npm test
          fi

      - name: Run build when configured
        shell: bash
        run: |
          build_script="$(node -e "const p=require('./package.json'); console.log((p.scripts && p.scripts.build) || '')")"
          if [ -z "$build_script" ]; then
            echo "No npm build script configured for $SERVICE_NAME."
          else
            npm run build
          fi

  sonar:
    name: SonarCloud code analysis
    runs-on: ubuntu-latest
    needs: validate
    continue-on-error: true

    steps:
      - name: Checkout service
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarCloud scan and quality gate
        uses: SonarSource/sonarqube-scan-action@v7.1.0
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >-
            -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }}
            -Dsonar.projectName=${{ env.SERVICE_NAME }}
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.exclusions=.github/**
            -Dsonar.coverage.exclusions=**/*
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=600

  snyk_scan:
    name: Snyk dependency scan
    runs-on: ubuntu-latest
    needs: validate
    continue-on-error: true
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

    steps:
      - name: Checkout service
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Setup Snyk
        if: env.SNYK_TOKEN != ''
        uses: snyk/actions/setup@master

      - name: Snyk dependency scan
        if: env.SNYK_TOKEN != ''
        shell: bash
        run: snyk test --file=package-lock.json --severity-threshold=high || true

      - name: Skip Snyk when token is missing
        if: env.SNYK_TOKEN == ''
        run: echo "SNYK_TOKEN is not configured. Skipping Snyk scan."
